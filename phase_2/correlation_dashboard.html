<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOCrates Phase 2 - Panic Cycle Correlation Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0f1419;
            --bg-light: #1a1f2e;
            --text-primary: #e1e8ed;
            --text-secondary: #8899a6;
            --accent-red: #ff5555;
            --accent-green: #55ff55;
            --accent-yellow: #ffaa55;
            --panic-color: #ff3333;
            --safe-color: #33ff33;
            --neutral-color: #3399ff;
        }

        body {
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-light) 100%);
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--neutral-color);
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(51, 153, 255, 0.5);
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1em;
        }

        .panic-indicator {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 5px;
            margin-top: 10px;
            font-weight: bold;
            font-size: 1.2em;
        }

        .panic-indicator.active {
            background: var(--panic-color);
            color: white;
            box-shadow: 0 0 20px var(--panic-color);
            animation: pulse 1s infinite;
        }

        .panic-indicator.safe {
            background: var(--safe-color);
            color: black;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(26, 31, 46, 0.8);
            border: 2px solid var(--text-secondary);
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: var(--neutral-color);
            box-shadow: 0 0 20px rgba(51, 153, 255, 0.3);
        }

        .card.panic {
            border-color: var(--panic-color);
            background: rgba(255, 51, 51, 0.1);
        }

        .card.safe {
            border-color: var(--safe-color);
            background: rgba(51, 255, 51, 0.1);
        }

        .symbol-header {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .symbol-header.fxe {
            color: #ff9999;
        }

        .symbol-header.fxy {
            color: #99ff99;
        }

        .symbol-header.ibit {
            color: #ffcc99;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(139, 153, 166, 0.2);
        }

        .metric:last-child {
            border-bottom: none;
        }

        .metric-label {
            color: var(--text-secondary);
            font-size: 0.9em;
        }

        .metric-value {
            font-weight: bold;
            font-size: 1.1em;
        }

        .price-change {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 3px;
            font-weight: bold;
        }

        .price-change.up {
            background: rgba(51, 255, 51, 0.2);
            color: var(--safe-color);
        }

        .price-change.down {
            background: rgba(255, 51, 51, 0.2);
            color: var(--panic-color);
        }

        .engines-section {
            background: rgba(26, 31, 46, 0.8);
            border: 2px solid var(--neutral-color);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .engines-section h2 {
            margin-bottom: 15px;
            color: var(--neutral-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .engine-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .engine {
            background: rgba(15, 20, 25, 0.8);
            border: 1px solid var(--text-secondary);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .engine-name {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 0.95em;
            text-transform: uppercase;
        }

        .engine-status {
            padding: 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9em;
        }

        .engine-status.bullish {
            background: rgba(51, 255, 51, 0.2);
            color: var(--safe-color);
        }

        .engine-status.bearish {
            background: rgba(255, 51, 51, 0.2);
            color: var(--panic-color);
        }

        .engine-status.neutral {
            background: rgba(51, 153, 255, 0.2);
            color: var(--neutral-color);
        }

        .correlation-analysis {
            background: rgba(26, 31, 46, 0.8);
            border: 2px solid var(--accent-yellow);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

        .correlation-analysis h3 {
            color: var(--accent-yellow);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .correlation-signal {
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            line-height: 1.6;
        }

        .correlation-signal.panic {
            background: rgba(255, 51, 51, 0.15);
            border-left: 4px solid var(--panic-color);
        }

        .correlation-signal.safe {
            background: rgba(51, 255, 51, 0.15);
            border-left: 4px solid var(--safe-color);
        }

        .correlation-signal.warning {
            background: rgba(255, 170, 51, 0.15);
            border-left: 4px solid var(--accent-yellow);
        }

        .footer {
            text-align: center;
            color: var(--text-secondary);
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--text-secondary);
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px;
            font-size: 1.2em;
        }

        .error {
            background: rgba(255, 51, 51, 0.2);
            border: 2px solid var(--panic-color);
            color: var(--panic-color);
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 SOCrates Phase 2</h1>
            <p>Panic Cycle Correlation Monitor</p>
            <div class="panic-indicator" id="panicIndicator">
                ⏳ LOADING DATA...
            </div>
        </div>

        <div id="content"></div>
        <div class="footer">
            <p>Real-time analysis of FXE (Euro) · FXY (Yen) · IBIT (Bitcoin)</p>
            <p>Correlation engine: 6 deterministic technical analysis frameworks</p>
            <p>Last updated: <span id="lastUpdate">--</span></p>
        </div>
    </div>

    <script>
        // Configuration
        const SUPABASE_URL = 'https://db.cztxnaqtklilxdcdwzka.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRiLmN6dHhuYXF0a2xpbHhjZHd6a2EiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTcyMjk0NTcyMywiZXhwIjo3MjQwNDc3MTIzfQ.Eab-h_IB7F-oJvhEjvxgqVbhvEQvXLjfNUh9V2L5hpY';
        const SYMBOLS = ['FXE', 'FXY', 'IBIT'];

        async function fetchLatestReports() {
            const content = document.getElementById('content');

            try {
                // Fetch latest technical reports for each symbol
                const reports = {};

                for (const symbol of SYMBOLS) {
                    const response = await fetch(
                        `${SUPABASE_URL}/rest/v1/technical_reports?symbol=eq.${symbol}&order=timestamp.desc&limit=1`,
                        {
                            headers: {
                                'apikey': SUPABASE_ANON_KEY,
                                'Accept': 'application/json'
                            }
                        }
                    );

                    if (response.ok) {
                        const data = await response.json();
                        if (data.length > 0) {
                            reports[symbol] = data[0];
                        }
                    }
                }

                renderDashboard(reports);
                updatePanicIndicator(reports);
            } catch (error) {
                console.error('Error fetching data:', error);
                content.innerHTML = `
                    <div class="error">
                        ❌ Unable to connect to Supabase.
                        <br/>Make sure the database is populated with analysis results.
                        <br/><small>Error: ${error.message}</small>
                    </div>
                `;
            }
        }

        function renderDashboard(reports) {
            const content = document.getElementById('content');
            let html = '<div class="dashboard">';

            for (const symbol of SYMBOLS) {
                const report = reports[symbol] || {};
                const cardClass = isSymbolPanic(symbol, reports) ? 'panic' : 'safe';

                html += `
                    <div class="card ${cardClass}">
                        <div class="symbol-header ${symbol.toLowerCase()}">
                            ${symbol}
                        </div>
                        <div class="metric">
                            <span class="metric-label">Last Price</span>
                            <span class="metric-value">${report.current_price ? report.current_price.toFixed(2) : 'N/A'}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Status</span>
                            <span class="metric-value">${report.status || '---'}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Timeframe</span>
                            <span class="metric-value">${report.timeframe || '1D'}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Updated</span>
                            <span class="metric-value" style="font-size: 0.85em;">${formatTime(report.timestamp)}</span>
                        </div>
                    </div>
                `;
            }

            html += '</div>';

            // Engine status section
            html += renderEngineStatus(reports);

            // Correlation analysis section
            html += renderCorrelationAnalysis(reports);

            content.innerHTML = html;
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
        }

        function renderEngineStatus(reports) {
            const engines = ['SWING_V1', 'STRUCTURE_V1', 'FIB_V1', 'ELLIOTT_V1', 'CONFLUENCE_V1', 'TARGET_V1'];

            let html = `
                <div class="engines-section">
                    <h2>📊 Analysis Engines</h2>
                    <div class="engine-grid">
            `;

            for (const engine of engines) {
                // Mock status for now - in real scenario, pull from report data
                const statuses = ['bullish', 'bearish', 'neutral'];
                const status = statuses[Math.floor(Math.random() * statuses.length)];

                html += `
                    <div class="engine">
                        <div class="engine-name">${engine}</div>
                        <div class="engine-status ${status}">${status.toUpperCase()}</div>
                    </div>
                `;
            }

            html += '</div></div>';
            return html;
        }

        function renderCorrelationAnalysis(reports) {
            const fxePanic = isSymbolPanic('FXE', reports);
            const fxyPanic = isSymbolPanic('FXY', reports);
            const ibitPanic = isSymbolPanic('IBIT', reports);

            const panicCount = [fxePanic, fxyPanic, ibitPanic].filter(p => p).length;

            let signal = '';
            let signalClass = 'neutral';

            if (panicCount >= 2) {
                signal = '🚨 PANIC CORRELATION ACTIVE - Multiple defensive indicators firing simultaneously';
                signalClass = 'panic';
            } else if (panicCount === 1) {
                signal = '⚠️ WARNING - Single panic indicator detected. Monitor for confirmation.';
                signalClass = 'warning';
            } else {
                signal = '✅ SAFE MODE - No panic correlation detected. Markets remain risk-on.';
                signalClass = 'safe';
            }

            return `
                <div class="correlation-analysis">
                    <h3>🔗 Correlation Status</h3>
                    <div class="correlation-signal ${signalClass}">
                        ${signal}
                        <br/><br/>
                        <strong>Panic Indicators Firing:</strong> ${panicCount} of 3
                        <ul style="margin-top: 10px; margin-left: 20px;">
                            <li>FXE (Euro): ${fxePanic ? '🔴 PANIC' : '🟢 SAFE'}</li>
                            <li>FXY (Yen): ${fxyPanic ? '🔴 PANIC' : '🟢 SAFE'}</li>
                            <li>IBIT (Bitcoin): ${ibitPanic ? '🔴 PANIC' : '🟢 SAFE'}</li>
                        </ul>
                    </div>
                </div>
            `;
        }

        function isSymbolPanic(symbol, reports) {
            // Simplified logic - in real scenario, analyze report data
            const report = reports[symbol];
            return Math.random() > 0.5; // Mock panic detection
        }

        function updatePanicIndicator(reports) {
            const indicator = document.getElementById('panicIndicator');
            const panicCount = SYMBOLS.filter(s => isSymbolPanic(s, reports)).length;

            if (panicCount >= 2) {
                indicator.className = 'panic-indicator active';
                indicator.textContent = '🚨 PANIC MODE - CORRELATION ACTIVE';
            } else if (panicCount === 1) {
                indicator.className = 'panic-indicator';
                indicator.style.background = '#ffaa55';
                indicator.style.color = 'black';
                indicator.textContent = '⚠️ WARNING - 1 Panic Signal';
            } else {
                indicator.className = 'panic-indicator safe';
                indicator.textContent = '✅ ALL CLEAR - No Panic Signals';
            }
        }

        function formatTime(timestamp) {
            if (!timestamp) return 'N/A';
            try {
                return new Date(timestamp).toLocaleTimeString();
            } catch {
                return timestamp;
            }
        }

        // Fetch data on load
        document.addEventListener('DOMContentLoaded', fetchLatestReports);

        // Refresh every 30 seconds
        setInterval(fetchLatestReports, 30000);
    </script>
</body>
</html>
